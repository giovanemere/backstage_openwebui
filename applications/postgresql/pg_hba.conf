# =============================================================================
# PostgreSQL Client Authentication Configuration - Demo Minikube
# =============================================================================
# pg_hba.conf - Host-based authentication file for demo environment
# Configuración simplificada para demo (NO usar en producción)

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# =============================================================================
# LOCAL CONNECTIONS
# =============================================================================
# "local" is for Unix domain socket connections only
local   all             all                                     trust

# =============================================================================
# IPv4 CONNECTIONS (Demo configuration - permissive for simplicity)
# =============================================================================
# IPv4 local connections:
host    all             all             127.0.0.1/32            md5

# Allow connections from Kubernetes pods (Minikube network)
host    all             all             10.0.0.0/8              md5
host    all             all             172.16.0.0/12           md5
host    all             all             192.168.0.0/16          md5

# Allow connections from Docker containers
host    all             all             172.17.0.0/16           md5

# =============================================================================
# IPv6 CONNECTIONS
# =============================================================================
# IPv6 local connections:
host    all             all             ::1/128                 md5

# =============================================================================
# DEMO-SPECIFIC CONNECTIONS
# =============================================================================
# Allow Backstage application connections
host    backstage_openwebui    backstage       all             md5

# Allow OpenWebUI application connections  
host    backstage_openwebui    openwebui       all             md5

# Allow admin connections for demo
host    all             postgres        all                     md5

# =============================================================================
# SECURITY NOTES FOR DEMO:
# =============================================================================
# - Esta configuración es SOLO para demo en Minikube
# - NO usar en producción
# - Las conexiones están configuradas de forma permisiva para facilitar la demo
# - En producción usar configuraciones más restrictivas con SSL
# =============================================================================
