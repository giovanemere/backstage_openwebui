# =============================================================================
# PostgreSQL Configuration - Optimized for Minikube Demo
# =============================================================================
# Configuración optimizada para recursos limitados (256Mi RAM, 200m CPU)

# =============================================================================
# MEMORY SETTINGS (Optimized for 256Mi container limit)
# =============================================================================
shared_buffers = 32MB                    # 1/8 of available memory
effective_cache_size = 128MB             # 1/2 of available memory
work_mem = 2MB                           # Reduced for limited memory
maintenance_work_mem = 16MB              # For maintenance operations
temp_buffers = 8MB                       # Temporary buffer size

# =============================================================================
# CONNECTION SETTINGS
# =============================================================================
max_connections = 20                     # Reduced for demo environment
listen_addresses = '*'                   # Listen on all interfaces
port = 5432                             # Standard PostgreSQL port

# =============================================================================
# PERFORMANCE SETTINGS (Optimized for demo)
# =============================================================================
random_page_cost = 1.1                  # SSD optimization
effective_io_concurrency = 200          # SSD optimization
max_worker_processes = 2                 # Limited by CPU
max_parallel_workers_per_gather = 1     # Conservative for limited CPU
max_parallel_workers = 2                # Total parallel workers

# =============================================================================
# LOGGING SETTINGS (Minimal for demo)
# =============================================================================
logging_collector = off                 # Disable log collector to save resources
log_destination = 'stderr'              # Log to stderr
log_statement = 'none'                  # Don't log statements (save space)
log_duration = off                      # Don't log duration
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# =============================================================================
# CHECKPOINT SETTINGS (Optimized for demo)
# =============================================================================
checkpoint_completion_target = 0.9      # Spread checkpoints
wal_buffers = 1MB                       # WAL buffer size
checkpoint_timeout = 15min              # Checkpoint frequency

# =============================================================================
# QUERY PLANNER SETTINGS
# =============================================================================
default_statistics_target = 50          # Reduced statistics target
constraint_exclusion = partition        # Enable constraint exclusion

# =============================================================================
# DEMO-SPECIFIC SETTINGS
# =============================================================================
# Enable extensions needed for Backstage and OpenWebUI
shared_preload_libraries = ''           # No additional libraries for demo

# Timezone
timezone = 'UTC'
log_timezone = 'UTC'

# Locale settings
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# =============================================================================
# SECURITY SETTINGS (Basic for demo)
# =============================================================================
ssl = off                               # Disable SSL for demo simplicity
password_encryption = md5               # Basic password encryption
