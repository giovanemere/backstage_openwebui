apiVersion: v1
kind: Secret
metadata:
  name: openwebui-secrets
  namespace: openwebui-demo
  labels:
    app: openwebui
    component: secrets
    demo.minikube: "true"
type: Opaque
data:
  # Base64 encoded values for demo
  # jwt-secret: demo-jwt-secret-key-12345 (ZGVtby1qd3Qtc2VjcmV0LWtleS0xMjM0NQ==)
  # openai-api-key: demo-openai-key (ZGVtby1vcGVuYWkta2V5)
  # backstage-api-token: demo-backstage-token (ZGVtby1iYWNrc3RhZ2UtdG9rZW4=)
  JWT_SECRET: ZGVtby1qd3Qtc2VjcmV0LWtleS0xMjM0NQ==
  OPENAI_API_KEY: ZGVtby1vcGVuYWkta2V5
  BACKSTAGE_API_TOKEN: ZGVtby1iYWNrc3RhZ2UtdG9rZW4=
  
---
apiVersion: v1
kind: Secret
metadata:
  name: openwebui-db-secrets
  namespace: openwebui-demo
  labels:
    app: openwebui
    component: database-secrets
    demo.minikube: "true"
type: Opaque
data:
  # Base64 encoded database credentials
  # postgres-user: openwebui (b3BlbndlYnVp)
  # postgres-password: openwebui123 (b3BlbndlYnVpMTIz)
  # postgres-db: openwebui (b3BlbndlYnVp)
  POSTGRES_USER: b3BlbndlYnVp
  POSTGRES_PASSWORD: b3BlbndlYnVpMTIz
  POSTGRES_DB: b3BlbndlYnVp
  POSTGRES_HOST: cG9zdGdyZXNxbA==  # postgresql
  POSTGRES_PORT: NTQzMg==  # 5432

---
apiVersion: v1
kind: Secret
metadata:
  name: openwebui-admin-secrets
  namespace: openwebui-demo
  labels:
    app: openwebui
    component: admin-secrets
    demo.minikube: "true"
type: Opaque
data:
  # Base64 encoded admin credentials
  # admin-email: admin@demo.com (YWRtaW5AZGVtby5jb20=)
  # admin-password: demo123 (ZGVtbzEyMw==)
  # admin-name: Demo Admin (RGVtbyBBZG1pbg==)
  ADMIN_EMAIL: YWRtaW5AZGVtby5jb20=
  ADMIN_PASSWORD: ZGVtbzEyMw==
  ADMIN_NAME: RGVtbyBBZG1pbg==
