apiVersion: v1
kind: Service
metadata:
  name: openwebui
  namespace: openwebui-demo
  labels:
    app: openwebui
    component: frontend
    demo.minikube: "true"
    app.kubernetes.io/name: openwebui
    app.kubernetes.io/part-of: backstage-openwebui-demo
  annotations:
    demo.minikube/optimized: "true"
    demo.minikube/description: "Servicio para OpenWebUI frontend"
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 80
      targetPort: proxy
      protocol: TCP
      name: proxy
  selector:
    app: openwebui
    component: frontend

---
apiVersion: v1
kind: Service
metadata:
  name: openwebui-headless
  namespace: openwebui-demo
  labels:
    app: openwebui
    component: frontend-headless
    demo.minikube: "true"
  annotations:
    demo.minikube/description: "Servicio headless para OpenWebUI"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: openwebui
    component: frontend

---
apiVersion: v1
kind: Service
metadata:
  name: openwebui-api
  namespace: openwebui-demo
  labels:
    app: openwebui
    component: api
    demo.minikube: "true"
  annotations:
    demo.minikube/description: "Servicio específico para API de OpenWebUI"
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: api
  selector:
    app: openwebui
    component: frontend
