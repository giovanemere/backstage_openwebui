apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openwebui-network-policy
  namespace: openwebui-demo
  labels:
    app: openwebui
    component: network-security
    demo.minikube: "true"
    app.kubernetes.io/name: openwebui-network-policy
    app.kubernetes.io/part-of: backstage-openwebui-demo
  annotations:
    demo.minikube/optimized: "true"
    demo.minikube/description: "Network policy para OpenWebUI (permisiva para demo)"
    demo.minikube/security-level: "demo"
spec:
  podSelector:
    matchLabels:
      app: openwebui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Permitir tráfico desde Nginx Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
    # Permitir tráfico desde Backstage
    - from:
        - namespaceSelector:
            matchLabels:
              name: backstage-demo
        - podSelector:
            matchLabels:
              app: backstage
      ports:
        - protocol: TCP
          port: 8080
    # Permitir tráfico interno del namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: openwebui-demo
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 80
    # Permitir health checks desde cualquier lugar (para demo)
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Permitir conexión a PostgreSQL
    - to:
        - namespaceSelector:
            matchLabels:
              name: database-demo
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Permitir conexión a Backstage
    - to:
        - namespaceSelector:
            matchLabels:
              name: backstage-demo
        - podSelector:
            matchLabels:
              app: backstage
      ports:
        - protocol: TCP
          port: 7007
    # Permitir DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Permitir conexiones HTTPS para APIs externas (OpenAI, etc.)
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    # Permitir conexión a Ollama (si está disponible)
    - to:
        - podSelector:
            matchLabels:
              app: ollama
      ports:
        - protocol: TCP
          port: 11434

---
