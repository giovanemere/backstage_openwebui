apiVersion: v1
kind: ServiceAccount
metadata:
  name: openwebui
  namespace: openwebui-demo
  labels:
    app: openwebui
    component: serviceaccount
    demo.minikube: "true"
    app.kubernetes.io/name: openwebui
    app.kubernetes.io/part-of: backstage-openwebui-demo
  annotations:
    demo.minikube/description: "ServiceAccount para OpenWebUI con permisos básicos"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openwebui-role
  namespace: openwebui-demo
  labels:
    app: openwebui
    component: rbac
    demo.minikube: "true"
rules:
  # Permisos para leer configuraciones
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  # Permisos para leer pods (para health checks)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Permisos para leer servicios (para service discovery)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # Permisos para eventos (para logging)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openwebui-rolebinding
  namespace: openwebui-demo
  labels:
    app: openwebui
    component: rbac
    demo.minikube: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openwebui-role
subjects:
  - kind: ServiceAccount
    name: openwebui
    namespace: openwebui-demo

---
# ClusterRole para acceso cross-namespace (comunicación con Backstage)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openwebui-cross-namespace
  labels:
    app: openwebui
    component: rbac
    demo.minikube: "true"
rules:
  # Permisos para comunicarse con Backstage
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
    resourceNames: ["backstage", "backstage-headless"]
  # Permisos para leer información básica de otros namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openwebui-cross-namespace
  labels:
    app: openwebui
    component: rbac
    demo.minikube: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openwebui-cross-namespace
subjects:
  - kind: ServiceAccount
    name: openwebui
    namespace: openwebui-demo
