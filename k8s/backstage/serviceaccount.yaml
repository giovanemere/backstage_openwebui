apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage
  namespace: backstage-demo
  labels:
    app: backstage
    component: serviceaccount
    demo.minikube: "true"
    app.kubernetes.io/name: backstage
    app.kubernetes.io/part-of: backstage-openwebui-demo
  annotations:
    demo.minikube/description: "ServiceAccount para Backstage con permisos de Kubernetes"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-reader
  labels:
    app: backstage
    component: rbac
    demo.minikube: "true"
rules:
  # Permisos para leer recursos de Kubernetes (plugin de Kubernetes)
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumes", "persistentvolumeclaims", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-reader
  labels:
    app: backstage
    component: rbac
    demo.minikube: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backstage-reader
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage-demo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-namespace-admin
  namespace: backstage-demo
  labels:
    app: backstage
    component: rbac
    demo.minikube: "true"
rules:
  # Permisos completos en el namespace del demo
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-namespace-admin
  namespace: backstage-demo
  labels:
    app: backstage
    component: rbac
    demo.minikube: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-namespace-admin
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage-demo
