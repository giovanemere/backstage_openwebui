apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage-demo
  labels:
    app: backstage
    component: backend
    demo.minikube: "true"
    app.kubernetes.io/name: backstage
    app.kubernetes.io/part-of: backstage-openwebui-demo
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
      component: backend
  template:
    metadata:
      labels:
        app: backstage
        component: backend
        demo.minikube: "true"
      annotations:
        demo.minikube/optimized: "true"
        demo.minikube/memory-limit: "512Mi"
        demo.minikube/cpu-limit: "500m"
    spec:
      serviceAccountName: backstage
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      initContainers:
        - name: wait-for-db
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              echo "Esperando a que PostgreSQL esté listo..."
              until nc -z postgresql 5432; do
                echo "PostgreSQL no está listo, esperando..."
                sleep 2
              done
              echo "PostgreSQL está listo!"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      containers:
        - name: backstage
          image: edissonz8809/iaops/backstage:demo-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_CONFIG_app_baseUrl
              value: "http://backstage:7007"
            - name: APP_CONFIG_backend_baseUrl
              value: "http://backstage:7007"
            - name: APP_CONFIG_backend_listen_port
              value: "7007"
            - name: APP_CONFIG_backend_listen_host
              value: "0.0.0.0"
          envFrom:
            - secretRef:
                name: backstage-secrets
            - secretRef:
                name: backstage-db-secrets
          volumeMounts:
            - name: app-config
              mountPath: /app/app-config.yaml
              subPath: app-config.yaml
              readOnly: true
            - name: entities-config
              mountPath: /app/examples/entities.yaml
              subPath: entities.yaml
              readOnly: true
            - name: temp-dir
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/catalog/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/catalog/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: app-config
          configMap:
            name: backstage-config
            items:
              - key: app-config.yaml
                path: app-config.yaml
        - name: entities-config
          configMap:
            name: backstage-config
            items:
              - key: entities.yaml
                path: entities.yaml
        - name: temp-dir
          emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
