apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: backstage-demo
  labels:
    app: backstage
    component: secrets
    demo.minikube: "true"
type: Opaque
data:
  # Base64 encoded values for demo
  # github-token: demo-token (ZGVtby10b2tlbg==)
  # openwebui-token: demo-openwebui-token (ZGVtby1vcGVud2VidWktdG9rZW4=)
  GITHUB_TOKEN: ZGVtby10b2tlbg==
  OPENWEBUI_TOKEN: ZGVtby1vcGVud2VidWktdG9rZW4=
  
---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-db-secrets
  namespace: backstage-demo
  labels:
    app: backstage
    component: database-secrets
    demo.minikube: "true"
type: Opaque
data:
  # Base64 encoded database credentials
  # postgres-user: backstage (YmFja3N0YWdl)
  # postgres-password: backstage123 (YmFja3N0YWdlMTIz)
  # postgres-db: backstage (YmFja3N0YWdl)
  POSTGRES_USER: YmFja3N0YWdl
  POSTGRES_PASSWORD: YmFja3N0YWdlMTIz
  POSTGRES_DB: YmFja3N0YWdl
  POSTGRES_HOST: cG9zdGdyZXNxbA==  # postgresql
  POSTGRES_PORT: NTQzMg==  # 5432
