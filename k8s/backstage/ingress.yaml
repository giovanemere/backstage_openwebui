apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage-ingress
  namespace: backstage-demo
  labels:
    app: backstage
    component: ingress
    demo.minikube: "true"
    app.kubernetes.io/name: backstage
    app.kubernetes.io/part-of: backstage-openwebui-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Accept-Encoding "";
      sub_filter '<head>' '<head><base href="/backstage/">';
      sub_filter_once on;
    demo.minikube/optimized: "true"
    demo.minikube/description: "Ingress para acceso web a Backstage"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /backstage(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  number: 7007
          - path: /api(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  number: 7007

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage-api-ingress
  namespace: backstage-demo
  labels:
    app: backstage
    component: api-ingress
    demo.minikube: "true"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    demo.minikube/description: "Ingress específico para API de Backstage"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /backstage-api/(.*)
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  number: 7007
