apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage-demo
  labels:
    app: backstage
    component: backend
    demo.minikube: "true"
    app.kubernetes.io/name: backstage
    app.kubernetes.io/part-of: backstage-openwebui-demo
  annotations:
    demo.minikube/optimized: "true"
    demo.minikube/description: "Servicio para Backstage backend"
spec:
  type: ClusterIP
  ports:
    - port: 7007
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: backstage
    component: backend

---
apiVersion: v1
kind: Service
metadata:
  name: backstage-headless
  namespace: backstage-demo
  labels:
    app: backstage
    component: backend-headless
    demo.minikube: "true"
  annotations:
    demo.minikube/description: "Servicio headless para Backstage"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 7007
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: backstage
    component: backend
