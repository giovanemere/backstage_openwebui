apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backstage.fullname" . }}-secrets
  labels:
    {{- include "backstage.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  backstage-secret: {{ "demo-backstage-secret-key" | b64enc | quote }}
