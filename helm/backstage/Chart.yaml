apiVersion: v2
name: backstage
description: Backstage Developer Portal optimizado para demo con OpenWebUI en Minikube
type: application
version: 0.1.0
appVersion: "1.20.0"
home: https://backstage.io
sources:
  - https://github.com/backstage/backstage
  - https://github.com/edissonz8809/iaops
maintainers:
  - name: Amazon Q
    email: demo@example.com
keywords:
  - backstage
  - developer-portal
  - demo
  - minikube
  - openwebui
  - kubernetes
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
annotations:
  demo.minikube/optimized: "true"
  demo.minikube/memory-limit: "512Mi"
  demo.minikube/cpu-limit: "500m"
  demo.minikube/features: "kubernetes-plugin,techdocs,catalog,scaffolder,openwebui-integration"
  demo.minikube/database: "postgresql"
