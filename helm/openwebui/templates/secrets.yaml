apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwebui.fullname" . }}-secrets
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- if .Values.ai.providers.openai.enabled }}
  openai-api-key: {{ .Values.ai.providers.openai.apiKey | default "demo-openai-key" | b64enc | quote }}
  {{- end }}
  {{- if .Values.ai.providers.anthropic.enabled }}
  anthropic-api-key: {{ .Values.ai.providers.anthropic.apiKey | default "demo-anthropic-key" | b64enc | quote }}
  {{- end }}
  {{- if .Values.backstage.integration.enabled }}
  backstage-auth-token: {{ .Values.backstage.integration.authToken | b64enc | quote }}
  {{- end }}
  webui-secret-key: {{ "demo-openwebui-secret-key" | b64enc | quote }}
