apiVersion: v1
kind: Service
metadata:
  name: {{ include "openwebui.fullname" . }}
  namespace: {{ include "openwebui.namespace" . }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    component: frontend
  annotations:
    {{- include "openwebui.annotations" . | nindent 4 }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol }}
      name: {{ .Values.service.targetPort }}
    {{- if .Values.service.proxy.enabled }}
    - port: {{ .Values.service.proxy.port }}
      targetPort: {{ .Values.service.proxy.targetPort }}
      protocol: TCP
      name: {{ .Values.service.proxy.targetPort }}
    {{- end }}
  selector:
    {{- include "openwebui.selectorLabels" . | nindent 4 }}
    component: frontend

---
{{- if .Values.service.headless.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openwebui.fullname" . }}-headless
  namespace: {{ include "openwebui.namespace" . }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    component: frontend-headless
  annotations:
    {{- include "openwebui.annotations" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol }}
      name: {{ .Values.service.targetPort }}
  selector:
    {{- include "openwebui.selectorLabels" . | nindent 4 }}
    component: frontend
{{- end }}

---
{{- if .Values.service.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openwebui.fullname" . }}-api
  namespace: {{ include "openwebui.namespace" . }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    component: api
  annotations:
    {{- include "openwebui.annotations" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.api.port }}
      targetPort: http
      protocol: TCP
      name: api
  selector:
    {{- include "openwebui.selectorLabels" . | nindent 4 }}
    component: frontend
{{- end }}
