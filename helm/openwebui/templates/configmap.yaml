kind: ConfigMap
metadata:
  name: {{ include "openwebui.fullname" . }}-nginx
  namespace: {{ include "openwebui.namespace" . }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    component: nginx-config
data:
