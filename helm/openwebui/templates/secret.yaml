apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwebui.fullname" . }}-secrets
  namespace: {{ include "openwebui.namespace" . }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    component: secrets
  annotations:
    {{- include "openwebui.annotations" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ .Values.openwebui.secretKey | b64enc }}
  {{- if .Values.openwebui.ai.providers.openai.enabled }}
  OPENAI_API_KEY: {{ .Values.openwebui.ai.providers.openai.apiKey | b64enc }}
  {{- end }}
  {{- if .Values.openwebui.backstage.enabled }}
  BACKSTAGE_API_TOKEN: {{ .Values.openwebui.backstage.apiToken | b64enc }}
  {{- end }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwebui.fullname" . }}-db-secrets
  namespace: {{ include "openwebui.namespace" . }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    component: database-secrets
type: Opaque
data:
  POSTGRES_USER: {{ .Values.database.user | b64enc }}
  POSTGRES_PASSWORD: {{ .Values.database.password | b64enc }}
  POSTGRES_DB: {{ .Values.database.name | b64enc }}
  POSTGRES_HOST: {{ .Values.database.host | b64enc }}
  POSTGRES_PORT: {{ .Values.database.port | toString | b64enc }}

---
{{- if .Values.demo.sampleData.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwebui.fullname" . }}-admin-secrets
  namespace: {{ include "openwebui.namespace" . }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    component: admin-secrets
type: Opaque
data:
  {{- range .Values.demo.sampleData.users }}
  {{- if eq .role "admin" }}
  ADMIN_EMAIL: {{ .email | b64enc }}
  ADMIN_PASSWORD: {{ .password | b64enc }}
  ADMIN_NAME: {{ printf "Demo Admin" | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
