{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openwebui.serviceAccountName" . }}
  namespace: {{ include "openwebui.namespace" . }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    component: serviceaccount
  annotations:
    {{- include "openwebui.annotations" . | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openwebui.fullname" . }}-role
  namespace: {{ include "openwebui.namespace" . }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    component: rbac
rules:
  {{- with .Values.rbac.rules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openwebui.fullname" . }}-rolebinding
  namespace: {{ include "openwebui.namespace" . }}
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openwebui.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "openwebui.serviceAccountName" . }}
    namespace: {{ include "openwebui.namespace" . }}

{{- if .Values.demo.backstageIntegration.crossNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openwebui.fullname" . }}-cross-namespace
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    component: rbac
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
    resourceNames: ["backstage", "backstage-headless"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "openwebui.fullname" . }}-cross-namespace
  labels:
    {{- include "openwebui.labels" . | nindent 4 }}
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "openwebui.fullname" . }}-cross-namespace
subjects:
  - kind: ServiceAccount
    name: {{ include "openwebui.serviceAccountName" . }}
    namespace: {{ include "openwebui.namespace" . }}
{{- end }}
{{- end }}
